<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade JavaScript</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Atividade JavaScript</h1>
<div class="menu">
<a href="#q1">Notas</a><a href="#q2">Tabuada</a><a href="#q3">Desconto</a><a href="#q4">Alunos</a><a href="#q5">Pesquisa</a><a href="#q6">Estoque</a><a href="#q7">Frequência</a><a href="#q8">Tarefas</a><a href="#q9">Painel</a><a href="#q10">Sistema</a>
</div>
<section id="q1">
<h2>1 - Média dos alunos</h2>
<input id="nomeNota" placeholder="Nome"><input id="nota1" type="number" placeholder="Nota 1"><input id="nota2" type="number" placeholder="Nota 2"><input id="nota3" type="number" placeholder="Nota 3">
<button onclick="calcularMedia()">Calcular</button><p id="resultadoMedia"></p>
</section><section id="q2"><h2>2 - Tabuada</h2>
<input id="numero" type="number" placeholder="Número"><button onclick="tabuada()">Mostrar</button><button onclick="limparTabuada()">Limpar</button>
<div id="resultadoTabuada"></div>
</section>
<section id="q3">
<h2>3 - Desconto</h2>
<input id="produto" placeholder="Produto">
<input id="preco" type="number" placeholder="Preço">
<input id="quantidade" type="number" placeholder="Quantidade">
<input id="desconto" type="number" placeholder="Desconto %">
<button onclick="calcularDesconto()">Calcular</button>
<p id="resultadoDesconto"></p>
</section>
<section id="q4">
<h2>4 - Cadastro de alunos</h2>
<input id="nomeAluno" placeholder="Nome"><input id="idadeAluno" type="number" placeholder="Idade"><input id="cursoAluno" placeholder="Curso"><input id="matriculaAluno" placeholder="Matrícula"><input id="notaAluno" type="number" placeholder="Nota"><input id="freqAluno" type="number" placeholder="Frequência %">
<button onclick="cadastrarAluno()">Cadastrar</button>
<div id="listaAlunos"></div>
</section>
<section id="q5"><h2>5 - Pesquisa de alunos</h2>
<input id="pesquisa" placeholder="Nome ou curso">
<button onclick="pesquisarAluno()">Pesquisar</button><div id="resultadoPesquisa"></div>
</section>
<section id="q6">
<h2>6 - Estoque</h2>
<input id="nomeProduto" placeholder="Produto"><input id="codigoProduto" placeholder="Código"><input id="qtdProduto" type="number" placeholder="Quantidade"><input id="valorProduto" type="number" placeholder="Preço">
<button onclick="cadastrarEstoque()">Cadastrar</button>
<br>
<select id="produtoEstoque"></select>
<input id="movimento" type="number" placeholder="Quantidade">
<button onclick="entradaEstoque()">Entrada</button>
<button onclick="saidaEstoque()">Saída</button>
<div id="listaEstoque"></div>
<p id="valorEstoque"></p>
</section>
<section id="q7">
<h2>7 - Frequência</h2>
<select id="alunoFrequencia"></select>
<input id="dataFrequencia" type="date">
<select id="tipoFrequencia">
<option value="Presença">Presença</option>
<option value="Falta justificada">Falta justificada</option>
<option value="Falta não justificada">Falta não justificada</option>
</select>
<button onclick="registrarFrequencia()">Registrar</button>
<div id="listaFrequencia"></div>
</section>
<section id="q8">
<h2>8 - Tarefas</h2>
<input id="tituloTarefa" placeholder="Título">
<input id="descricaoTarefa" placeholder="Descrição">
<select id="prioridadeTarefa">
<option>Baixa</option>
<option>Média</option>
<option>Alta</option>
</select>
<input id="dataTarefa" type="date">
<button onclick="adicionarTarefa()">Adicionar</button>
<br>
<select id="filtroTarefa" onchange="mostrarTarefas()">
<option value="Todas">Todas</option>
<option value="Pendente">Pendentes</option>
<option value="Concluída">Concluídas</option>
</select>
<div id="listaTarefas"></div>
<p id="infoTarefas"></p>
</section>
<section id="q9">
<h2>9 - Painel escolar</h2>
<select id="filtroCurso" onchange="resumo()">
<option value="Todos">todos os cursos dessaBomba </option>
</select>
<div id="painel"></div>
<div id="grafico"></div>
</section>
<section id="q10">
<h2>10 - Sistema escolar</h2>
<p>Resumo do sistema:</p>
<div id="resumoGeral"></div>
<button onclick="imprimir()">Imprimir relatório</button>
</section>
<script src="script.js" defer></script>
</body>
</html>
